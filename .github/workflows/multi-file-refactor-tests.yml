# 第17节实验②：push / PR 后自动跑两个 app 的测试 + 硬编码密钥扫描
# 密钥扫描规则与本地一致，见
#   claude-code/multi-file-refactor/scripts/ci/scan_secrets.py
name: Multi-File Refactor CI

on:
  push:
    paths: &scoped_paths
      - '.github/workflows/multi-file-refactor-tests.yml'
      - 'claude-code/multi-file-refactor/**'
  pull_request:
    branches: [main]
    paths: *scoped_paths

permissions:
  contents: read

# 同一分支上新推送后，取消上一轮还在跑的 CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-automation-tests:
    name: Financial Automation · smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: claude-code/multi-file-refactor/financial-automation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: >-
            claude-code/multi-file-refactor/financial-automation/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m unittest tests.test_smoke -v

  crm-assistant-tests:
    name: CRM Assistant · stdlib tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: claude-code/multi-file-refactor/CRM-Assistant

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge policy tests
        run: python scripts/crm_assistant.py run-merge-policy-tests

      - name: Sample pipeline tests
        run: python scripts/crm_assistant.py run-sample-tests

  secret-scan:
    name: Hardcoded secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan tracked files
        run: >-
          python
          claude-code/multi-file-refactor/scripts/ci/scan_secrets.py
